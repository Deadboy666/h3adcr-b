name: Disable downgrader URL

on:
  push:
    branches:
      - fix/disable-downgrader-url

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/disable-downgrader-url

      - name: Comment out the downgrader URL
        run: |
          sed -i 's|^    Headcrab_Downgrade_URL="http://localhost:1666/"|    #Headcrab_Downgrade_URL="http://localhost:1666/"|' headcrab.sh
          grep -q '^    #Headcrab_Downgrade_URL="http://localhost:1666/"$' headcrab.sh
          ! grep -q '^    Headcrab_Downgrade_URL=' headcrab.sh
          bash -n headcrab.sh

      - name: Commit the change
        run: |
          rm -f .github/workflows/disable-downgrader-url.yml
          git config user.name "dankrr"
          git config user.email "24983056+dankrr@users.noreply.github.com"
          git add headcrab.sh .github/workflows/disable-downgrader-url.yml
          git commit -m "Disable downgrader URL"
          git push
